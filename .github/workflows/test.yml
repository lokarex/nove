name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test backend CI guards
        run: python -B -m unittest discover -s .github/scripts -p test_backend_contracts.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --workspace -- -D warnings

      - name: Test (candle-cpu)
        run: cargo test --locked --workspace --verbose

      - name: Test (native-cpu)
        run: cargo test --locked --workspace --no-default-features --features native-cpu --verbose

      - name: Doc tests
        run: cargo test --locked --workspace --doc --verbose

      - name: Check independent backend libraries
        run: python -B .github/scripts/check_backend_contracts.py --group libraries

      - name: Test CPU backend contracts and documentation
        run: python -B .github/scripts/check_backend_contracts.py --group cpu

      - name: Test backend families and internal CPU staging
        run: python -B .github/scripts/check_backend_contracts.py --group families

      - name: Check feature and dependency isolation
        run: python -B .github/scripts/check_backend_contracts.py --group isolation

      - name: Test mixed-backend model loading
        run: python -B .github/scripts/check_backend_contracts.py --group model
